name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Enable Gradle wrapper
        # Windows 체크아웃에서 실행 비트가 없어도 Linux에서 실행할 수 있게 한다.
        run: chmod +x backend/home-water-monitor-backend/gradlew
      - name: Verify backend
        shell: pwsh
        run: ./scripts/verify.ps1 -Mode Full
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-verification
          path: |
            backend/home-water-monitor-backend/build/reports/tests/
            backend/home-water-monitor-backend/build/test-results/
          if-no-files-found: warn
