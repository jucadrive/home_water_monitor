spring:
  application:
    name: home-water-monitor-backend
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:15432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# 재수신 트랜잭션의 행 잠금 대기를 제한하며 DB 전역 설정은 변경하지 않는다.
water-monitor:
  redelivery:
    lock-timeout-ms: 5000
