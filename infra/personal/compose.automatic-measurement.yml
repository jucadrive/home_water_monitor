# Opt-in only, after base + MQTT + LAN TLS overlays. Defaults OFF.
services:
  backend:
    environment:
      PPOSSAK_AUTO_MEASUREMENT_ENABLED: "${PPOSSAK_AUTO_MEASUREMENT_ENABLED:-false}"
      PPOSSAK_AUTO_MEASUREMENT_DEVICE_ID: "${PPOSSAK_AUTO_MEASUREMENT_DEVICE_ID:-}"
      PPOSSAK_AUTO_MEASUREMENT_CULTIVATION_ID: "${PPOSSAK_AUTO_MEASUREMENT_CULTIVATION_ID:-}"
