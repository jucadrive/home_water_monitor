allow_anonymous false
password_file /run/secrets/mosquitto.passwd
acl_file /run/secrets/mosquitto.acl
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages false
max_packet_size 65536
max_queued_messages 20
# Internal Docker listener remains unpublished on the host.
listener 1883
# Only this TLS listener is bound to the selected host LAN IP.
listener 8883
certfile /run/secrets/mqtt-server.crt
keyfile /run/secrets/mqtt-server.key
tls_version tlsv1.2
require_certificate false
