# Docker-network-only listener; do not publish this plaintext listener to the LAN.
listener 1883
allow_anonymous false
password_file /run/secrets/mosquitto.passwd
acl_file /run/secrets/mosquitto.acl
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages false
max_packet_size 65536
max_queued_messages 20
