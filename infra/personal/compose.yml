# Docker Compose >= 2.30; raw env_file preserves BCrypt '$'.
# Run with --env-file secrets/postgres.env.
name: ppossak-personal
x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_NAME:?DB_NAME is required}"
      POSTGRES_USER: "${DB_USERNAME:?DB_USERNAME is required}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
  backend:
    build: .
    image: ppossak-backend:${PPOSSAK_RELEASE:-local}
    restart: unless-stopped
    env_file:
      - path: secrets/auth.env
        format: raw
      - path: secrets/postgres.env
        format: raw
    environment:
      SPRING_PROFILES_ACTIVE: personal
      SERVER_ADDRESS: 0.0.0.0
      PPOSSAK_API_PORT: "8080"
      PPOSSAK_DB_JDBC_URL: "jdbc:postgresql://postgres:5432/${DB_NAME:?DB_NAME is required}"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, java, -cp, /app, Healthcheck]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *logging
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    user: "65532:65532"
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/tunnel.token]
    volumes:
      - type: bind
        source: ./secrets/tunnel.token
        target: /run/secrets/tunnel.token
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
volumes:
  postgres_data:
